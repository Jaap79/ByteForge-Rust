[package]
name = "byteforge-rust"
version = "1.2.3"
edition = "2021"
rust-version = "1.82"
description = "ByteForge Rust edition: native tabbed text editor with recoverable sessions"
build = "build.rs"

[[bin]]
name = "ByteForge-Rust"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange",
  "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Networking_WinHttp"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
